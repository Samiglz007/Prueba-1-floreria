<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elegancia Real | Aurora Edition</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="detalles.css">
    
    <link rel="stylesheet" href="../../carrito/carrito.css">
</head>
<body>

    <div class="aurora-bg"></div>

    <main class="master-container">
        <div class="product-layout">
            
            <div class="visual-box">
                <div class="main-image-wrapper">
                    <img src="arreglo36.jpeg" alt="Ramo Premium" id="zoom-img">
                </div>
                <div class="floating-label">Edición Limitada</div>
            </div>

            <div class="text-box">
                <header class="reveal">
                    <span class="pre-title">Artesanía Floral</span>
                    <h1 class="main-title">Elegancia <i>Real</i></h1>
                </header>

                <div class="description reveal delay-1">
                    <p>Un diálogo entre la naturaleza y la cultura pop. Rosas de corte profundo fusionadas con la esencia de Sanrio.</p>
                </div>

                <div class="price-action reveal delay-2">
                    <div class="price-group">
                    </div>
                    
                    <button class="magnetic-button" id="buy-action" onclick="agregarAlCarrito('Artesanía Floral - Elegancia Real', 45.00, 'arreglo36.jpeg')">
                        <span class="btn-circle"></span>
                        <span class="btn-text">Adquirir pieza</span>
                    </button>
                </div>

                <footer class="extra-info reveal delay-3">
                    <span>Disponible</span>
                </footer>
            </div>
        </div>
    </main>

    <div id="carrito-sidebar" class="carrito-sidebar">
        <div class="carrito-header">
            <h3>🛒 Mi Carrito</h3>
            <button id="btn-cerrar-carrito" class="btn-cerrar-carrito">&times;</button>
        </div>
        <div id="carrito-items" class="carrito-items">
            <p class="carrito-vacio">Tu carrito está vacío.</p>
        </div>
        <div class="carrito-footer">
            <div class="carrito-total">
                <span>Total:</span>
                <span id="carrito-total-precio">$0.00 USD</span>
            </div>
            <a href="#" id="btn-enviar-wa" class="btn-enviar-wa">
                Confirmar Pedido por WhatsApp
            </a>
        </div>
    </div>

    <script src="detalles.js"></script>
    
    <script src="../../carrito/carrito.js"></script>
</body>
</html>
